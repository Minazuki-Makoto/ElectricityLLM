name: electricity-llm

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  networks: [electricity-net]
  logging: *default-logging

services:
  mysql:
    <<: *common
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scms}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--defaults-extra-file=/etc/mysql/conf.d/electricity.cnf"]
    expose: ["3306"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/mysql:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/electricity.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 768m
    cpus: 0.60

  redis:
    <<: *common
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory ${REDIS_MAXMEMORY:-384mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction}
    expose: ["6379"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.25

  elasticsearch:
    <<: *common
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    expose: ["9200"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    cpus: 0.75

  neo4j:
    <<: *common
    image: neo4j:2026.06.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-768m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
      NEO4J_server_default__listen__address: 0.0.0.0
    expose: ["7474", "7687"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/neo4j/data:/data
      - ${DATA_ROOT:-/srv/electricity-llm/data}/neo4j/logs:/logs
      - ${DATA_ROOT:-/srv/electricity-llm/data}/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 30s
      retries: 15
      start_period: 45s
    mem_limit: 2g
    cpus: 0.50

  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    expose: ["9000", "9001"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.25

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    restart: "no"
    networks: [electricity-net]
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PLOT_BUCKET: ${MINIO_PLOT_BUCKET:-plot}
      MINIO_DOCUMENT_BUCKET: ${MINIO_DOCUMENT_BUCKET:-contracts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_PLOT_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_DOCUMENT_BUCKET}"
    logging: *default-logging

  rocketmq-nameserver:
    <<: *common
    image: apache/rocketmq:5.3.3
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: ${ROCKETMQ_NAMESRV_JAVA_OPTS:--Xms128m -Xmx256m}
    expose: ["9876"]
    volumes:
      - ${DATA_ROOT:-/srv/electricity-llm/data}/rocketmq/nameserver-logs:/home/rocketmq/logs
    mem_limit: 384m
    cpus: 0.25

  rocketmq-broker:
    <<: *common
    image: apache/rocketmq:5.3.3
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      JAVA_OPT_EXT: ${ROCKETMQ_BROKER_JAVA_OPTS:--Xms256m -Xmx512m}
    expose: ["10909", "10911", "10912"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - ${DATA_ROOT:-/srv/electricity-llm/data}/rocketmq/broker-logs:/home/rocketmq/logs
      - ${DATA_ROOT:-/srv/electricity-llm/data}/rocketmq/broker-store:/home/rocketmq/store
    depends_on: [rocketmq-nameserver]
    mem_limit: 768m
    cpus: 0.50

  rocketmq-proxy:
    <<: *common
    image: apache/rocketmq:5.3.3
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      JAVA_OPT_EXT: ${ROCKETMQ_PROXY_JAVA_OPTS:--Xms128m -Xmx384m}
    expose: ["8080", "8081"]
    volumes:
      - ./rocketmq/rmq-proxy.json:/home/rocketmq/conf/rmq-proxy.json:ro
      - ${DATA_ROOT:-/srv/electricity-llm/data}/rocketmq/proxy-logs:/home/rocketmq/logs
    depends_on: [rocketmq-nameserver, rocketmq-broker]
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    cpus: 0.35

  rocketmq-init:
    image: apache/rocketmq:5.3.3
    restart: "no"
    networks: [electricity-net]
    depends_on:
      rocketmq-proxy: {condition: service_healthy}
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      ROCKETMQ_TASK_TOPIC: ${ROCKETMQ_TASK_TOPIC:-llm-task-topic}
      ROCKETMQ_RESULT_TOPIC: ${ROCKETMQ_RESULT_TOPIC:-llm-task-result-topic}
      ROCKETMQ_CONSUMER_GROUP: ${ROCKETMQ_CONSUMER_GROUP:-llm-task-consumer-group}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sh mqadmin updateTopic -n "$${NAMESRV_ADDR}" -c DefaultCluster -t "$${ROCKETMQ_TASK_TOPIC}"
        sh mqadmin updateTopic -n "$${NAMESRV_ADDR}" -c DefaultCluster -t "$${ROCKETMQ_RESULT_TOPIC}"
        sh mqadmin updateSubGroup -n "$${NAMESRV_ADDR}" -c DefaultCluster -g "$${ROCKETMQ_CONSUMER_GROUP}"
    logging: *default-logging

  python-agent:
    <<: *common
    build:
      context: ..
      dockerfile: ElectricityLLM/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ELASTICSEARCH_VERIFY_CERTS: "false"
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      EMBEDDING_MODEL_PATH: /models/bge-m3
      RERANKER_MODEL_PATH: /models/reranker-model
      AGENT_OUTPUT_PATH: /app/logs/output-result.json
    expose: ["5000"]
    volumes:
      - ${MODEL_ROOT:-/srv/electricity-llm/models}:/models:ro
      - ${DATA_ROOT:-/srv/electricity-llm/data}/python-logs:/app/logs
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      minio: {condition: service_healthy}
    mem_limit: 8g
    cpus: 2.00

  spring-backend:
    <<: *common
    build:
      context: ..
      dockerfile: llm-back/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_URL: http://minio:9000
      FLASK_URL: http://python-agent:5000
      ROCKETMQ_ENDPOINTS: rocketmq-proxy:8081
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
    expose: ["8088"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      python-agent: {condition: service_healthy}
      rocketmq-init: {condition: service_completed_successfully}
    mem_limit: 768m
    cpus: 0.60

  nginx:
    <<: *common
    build:
      context: ..
      dockerfile: front/Dockerfile
    ports:
      - ${HTTP_PORT:-80}:80
    depends_on:
      spring-backend: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.20

networks:
  electricity-net:
    name: electricity-net
    driver: bridge
