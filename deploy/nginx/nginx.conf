user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 3m;

    upstream spring_backend {
        server spring-backend:8088;
        keepalive 16;
    }
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 保留 HTTP health，避免 Docker healthcheck 被 HTTPS 跳转影响
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "UP\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/8.149.244.201/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.149.244.201/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "UP\n";
    }

    location /ai {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        add_header X-Accel-Buffering no always;

        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location /plot/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
}
